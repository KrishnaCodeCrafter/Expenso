{% extends "base.html" %}

{% block title %}Create account — Expenso{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-container">

        <div class="auth-header">
            <h1 class="auth-title">Create your account</h1>
            <p class="auth-subtitle">Start tracking your expenses today</p>
        </div>

        <div class="auth-card">
            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="/register" class="auth-form" data-submit-text="Create account" data-loading-text="Creating account…">
                <div class="form-group">
                    <label for="name">Full name</label>
                    <input type="text" id="name" name="name"
                           class="form-input" placeholder="Enter your full name"
                           required autofocus>
                </div>
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email"
                           class="form-input" placeholder="abc@example.com"
                           required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password"
                           class="form-input" placeholder="Min. 8 characters"
                           required>
                </div>
                <div class="form-group">
                    <label for="confirm_password">Confirm password</label>
                    <input type="password" id="confirm_password" name="confirm_password"
                           class="form-input" placeholder="Confirm your password"
                           required>
                </div>
                <button type="submit" class="btn-submit">
                    <span class="btn-text">Create account</span>
                    <span class="btn-loader" aria-hidden="true">
                        <svg class="spinner" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                            <circle cx="12" cy="12" r="10" stroke-opacity="0.25"></circle>
                            <path d="M12 2a10 10 0 0 1 10 10" stroke-opacity="1"></path>
                        </svg>
                    </span>
                </button>
            </form>
        </div>

        <p class="auth-switch">
            Already have an account?
            <a href="{{ url_for('login') }}">Sign in</a>
        </p>

    </div>
</section>

{% endblock %}
